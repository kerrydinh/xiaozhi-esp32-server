# VieNeu-TTS (Vietnamese text-to-speech) as an OpenAI-compatible speech API,
# CPU/ONNX, for the XiaoZhi server's "OpenAI TTS" provider.
#
# Works as a Dockge stack or with `docker compose up -d`; settings in .env.
# The first start downloads the v3 Turbo model (~0.5 GB) into the cache volume.

name: vieneu-tts

services:
  vieneu-tts:
    image: ${VIENEU_IMAGE:-ghcr.io/kerrydinh/vieneu-tts:cpu}
    container_name: vieneu-tts
    restart: unless-stopped
    ports:
      - "${VIENEU_PORT:-8010}:8000"
    environment:
      TZ: ${TZ:-Etc/UTC}
      # Bearer key clients must send; XiaoZhi's TTS "API key" field
      VIENEU_API_KEY: ${VIENEU_API_KEY:?set VIENEU_API_KEY in .env}
      # int8 is ~2x faster but needs a CPU with AVX-VNNI/AVX512-VNNI
      VIENEU_PRECISION: ${VIENEU_PRECISION:-fp32}
      VIENEU_QUEUE: ${VIENEU_QUEUE:-4}
      VIENEU_QUEUE_TIMEOUT: ${VIENEU_QUEUE_TIMEOUT:-10}
      VIENEU_WATERMARK: ${VIENEU_WATERMARK:-1}
    volumes:
      - hf_cache:/home/app/.cache/huggingface

volumes:
  hf_cache:
